name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Show bash version
        run: bash --version | head -n 1
      - name: Syntax check
        run: make lint
      - name: Tests
        run: make test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: shellcheck
        run: shellcheck -x bin/*.sh lib/*.sh tests/*.sh
